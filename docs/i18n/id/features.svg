<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>Fitur go-scout</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Fitur go-scout</text>

  <!-- Kartu 1 : rantai kueri -->
  <rect x="40" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">Rantai kueri (scout.Builder)</text>
  <text x="60" y="100" font-size="10" fill="#555">API mengalir: Query · Where · WhereIn · WhereNotIn · OrderBy · Take</text>
  <text x="60" y="120" font-size="10" fill="#555">Lanjutan: VectorSearch · WhereRange · WhereGeoDistance · Aggregate</text>
  <text x="60" y="140" font-size="10" fill="#555">Callback: QueryCB · CallbackCB · AddResultProcessor</text>

  <!-- Kartu 2 : representasi antara DSL -->
  <rect x="480" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">IR DSL (engines/dsl.go)</text>
  <text x="500" y="100" font-size="10" fill="#555">Kondisi lanjutan → JSON bool query (must · filter · should)</text>
  <text x="500" y="120" font-size="10" fill="#555">multi_match · term · range · geo_distance · wildcard · regexp …</text>
  <text x="500" y="140" font-size="10" fill="#555">ES / OpenSearch berbagi; MapBooleanToBoolKey memetakan and/or/not</text>

  <!-- Kartu 3 : paginasi dan kursor -->
  <rect x="40" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Paginasi dan kursor</text>
  <text x="60" y="232" font-size="10" fill="#555">Paginate · SimplePaginate · Cursor dengan iterasi lazy</text>
  <text x="60" y="252" font-size="10" fill="#555">PaginationResult: LastPage · HasMorePages · AppendQuery</text>
  <text x="60" y="272" font-size="10" fill="#555">Result.As[T] / GetAs[T] generik untuk mengambil model</text>

  <!-- Kartu 4 : soft delete -->
  <rect x="480" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Soft delete</text>
  <text x="500" y="232" font-size="10" fill="#555">Metadata __soft_deleted pada dokumen (0 / 1)</text>
  <text x="500" y="252" font-size="10" fill="#555">Filter kueri OnlyTrashed / WithTrashed</text>
  <text x="500" y="272" font-size="10" fill="#555">Cabang Deleted pada observer · ForceDeleted / Restored</text>

  <!-- Kartu 5 : antrean asinkron -->
  <rect x="40" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Antrean asinkron (scout.Queue)</text>
  <text x="60" y="364" font-size="10" fill="#555">Antrean dalam proses: chan buffer 4096 + goroutine</text>
  <text x="60" y="384" font-size="10" fill="#555">Fallback sinkron dengan peringatan saat antrean tidak tersedia</text>
  <text x="60" y="404" font-size="10" fill="#555">MakeAllSearchable impor berkelompok (default 500)</text>

  <!-- Kartu 6 : event dan observer -->
  <rect x="480" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Event dan observer</text>
  <text x="500" y="364" font-size="10" fill="#555">ModelObserver mendengarkan Saved · Deleted · Restored</text>
  <text x="500" y="384" font-size="10" fill="#555">EventBus menerbitkan models_imported · models_flushed</text>
  <text x="500" y="404" font-size="10" fill="#555">WithoutSyncingToSearch menonaktifkan sinkronisasi sementara</text>

  <!-- Kartu 7 : pendaftaran multi-mesin -->
  <rect x="40" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Pendaftaran multi-mesin (EngineManager)</text>
  <text x="60" y="496" font-size="10" fill="#555">Extend + engines.Register: 15 driver</text>
  <text x="60" y="516" font-size="10" fill="#555">Driver lazy + cache; tidak dikenal → ErrNotSupported</text>
  <text x="60" y="536" font-size="10" fill="#555">Ganti mesin cukup dengan SCOUT_DRIVER</text>

  <!-- Kartu 8 : pencarian lanjutan -->
  <rect x="480" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Pencarian lanjutan (AdvancedEngine)</text>
  <text x="500" y="496" font-size="10" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <text x="500" y="516" font-size="10" fill="#555">Kemiripan vektor · rentang · filter & urutan geo</text>
  <text x="500" y="536" font-size="10" fill="#555">Agregasi (Aggregate) + facet (Facet) + highlight</text>

  <!-- Footer -->
  <rect x="40" y="582" width="880" height="36" rx="8" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="605" text-anchor="middle" font-size="12" fill="#3a3a3a">100 % pustaka standar · tanpa dependensi · Go 1.24 · port dari webman/laravel-scout</text>
</svg>
