<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="Arial,Helvetica,sans-serif">
  <title>go-scout — возможности</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Возможности go-scout</text>

  <!-- Карточка 1: цепочка построения запросов -->
  <rect x="40" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">Цепочка построения запросов (scout.Builder)</text>
  <text x="60" y="100" font-size="11" fill="#555">Потоковый API: Query · Where · WhereIn · WhereNotIn · OrderBy · Take</text>
  <text x="60" y="120" font-size="11" fill="#555">Расширенные: VectorSearch · WhereRange · WhereGeoDistance · Aggregate</text>
  <text x="60" y="140" font-size="11" fill="#555">Внедрение колбэков: QueryCB · CallbackCB · AddResultProcessor</text>

  <!-- Карточка 2: промежуточное представление DSL -->
  <rect x="480" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">Промежуточное представление DSL (engines/dsl.go)</text>
  <text x="500" y="100" font-size="11" fill="#555">Расширенные условия → bool-запрос JSON (must · filter · should)</text>
  <text x="500" y="120" font-size="11" fill="#555">multi_match · term · range · geo_distance · wildcard · regexp …</text>
  <text x="500" y="140" font-size="11" fill="#555">Общий для ES / OpenSearch; MapBooleanToBoolKey маппит and/or/not</text>

  <!-- Карточка 3: пагинация и курсоры -->
  <rect x="40" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Пагинация и курсоры</text>
  <text x="60" y="232" font-size="11" fill="#555">Paginate · SimplePaginate · Cursor — ленивый потоковый обход</text>
  <text x="60" y="252" font-size="11" fill="#555">PaginationResult: LastPage · HasMorePages · AppendQuery</text>
  <text x="60" y="272" font-size="11" fill="#555">Result.As[T] / пакетный дженерик GetAs[T] для получения моделей</text>

  <!-- Карточка 4: мягкое удаление -->
  <rect x="480" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Мягкое удаление</text>
  <text x="500" y="232" font-size="11" fill="#555">Метаданные __soft_deleted пишутся в индекс с документом (0 / 1)</text>
  <text x="500" y="252" font-size="11" fill="#555">Фильтрация запросов: OnlyTrashed / WithTrashed</text>
  <text x="500" y="272" font-size="11" fill="#555">Ветка Deleted наблюдателя · ForceDeleted / Restored</text>

  <!-- Карточка 5: асинхронная очередь -->
  <rect x="40" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Асинхронная очередь (scout.Queue)</text>
  <text x="60" y="364" font-size="11" fill="#555">Внутрипроцессная очередь: chan с буфером 4096 + рабочие горутины</text>
  <text x="60" y="384" font-size="11" fill="#555">При недоступности очереди — синхронный откат с предупреждением</text>
  <text x="60" y="404" font-size="11" fill="#555">MakeAllSearchable импортирует по блокам (по умолчанию 500)</text>

  <!-- Карточка 6: события и наблюдатели -->
  <rect x="480" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">События и наблюдатели</text>
  <text x="500" y="364" font-size="11" fill="#555">ModelObserver слушает Saved · Deleted · Restored — автосинхронизация</text>
  <text x="500" y="384" font-size="11" fill="#555">EventBus публикует models_imported · models_flushed</text>
  <text x="500" y="404" font-size="11" fill="#555">WithoutSyncingToSearch временно отключает синхронизацию</text>

  <!-- Карточка 7: регистрация нескольких движков -->
  <rect x="40" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Регистрация нескольких движков (EngineManager)</text>
  <text x="60" y="496" font-size="11" fill="#555">Extend + engines.Register регистрируют 15 имён драйверов</text>
  <text x="60" y="516" font-size="11" fill="#555">Драйверы ленивы и кэшируются; неизвестный драйвер → ErrNotSupported</text>
  <text x="60" y="536" font-size="11" fill="#555">Смена движка = изменение только SCOUT_DRIVER</text>

  <!-- Карточка 8: расширенный поиск -->
  <rect x="480" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Расширенный поиск (AdvancedEngine)</text>
  <text x="500" y="496" font-size="11" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <text x="500" y="516" font-size="11" fill="#555">Векторная схожесть · диапазон · фильтр/сортировка по георасстоянию</text>
  <text x="500" y="536" font-size="11" fill="#555">Агрегации (Aggregate) + фасеты (Facet) + подсветка</text>

  <!-- Нижняя полоса -->
  <rect x="40" y="582" width="880" height="36" rx="8" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="605" text-anchor="middle" font-size="13" fill="#3a3a3a">Только стандартная библиотека · ноль сторонних зависимостей · Go 1.24 · порт webman/laravel-scout</text>
</svg>
