<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Arial,Helvetica,sans-serif">
  <title>go-scout — подход к проектированию</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Подход к проектированию go-scout</text>

  <!-- Панель A: цепочечный Builder -->
  <rect x="40" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Цепочечный Builder несёт намерение запроса</text>
  <text x="60" y="106" font-size="11" fill="#555">Search(ctx, query, cb) возвращает *Builder;</text>
  <text x="60" y="128" font-size="11" fill="#555">цепочки лишь накапливают состояние</text>
  <text x="60" y="152" font-size="11" fill="#555">Get / First / Paginate / Cursor — один обмен с движком</text>
  <text x="60" y="174" font-size="11" fill="#555">QueryCB меняет запрос, CallbackCB — тело запроса,</text>
  <text x="60" y="196" font-size="11" fill="#555">AddResultProcessor постобрабатывает результат</text>
  <text x="60" y="222" font-size="11" fill="#555">Разбор полей поиска: Options["fields"] → FullTextColumner → FieldNames</text>

  <!-- Панель B: промежуточное представление DSL -->
  <rect x="480" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Промежуточное представление DSL</text>
  <text x="500" y="106" font-size="11" fill="#555">Компиляция расширенных условий через engines/dsl.go</text>
  <text x="500" y="130" font-size="11" fill="#555">в bool-запрос JSON; ES / OpenSearch потребляют напрямую,</text>
  <text x="500" y="150" font-size="11" fill="#555">meilisearch / typesense / algolia / database</text>
  <text x="500" y="174" font-size="11" fill="#555">переводят в свой синтаксис; MapBooleanToBoolKey:</text>
  <text x="500" y="198" font-size="11" fill="#555">and/or/not → filter/should/must_not; различия скрыты на уровне перевода</text>

  <!-- Панель C: изоляция интерфейса движка -->
  <rect x="40" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Изоляция интерфейса движка</text>
  <text x="60" y="326" font-size="11" fill="#555">Engine / AdvancedEngine: документы и результаты, без типов моделей</text>
  <text x="60" y="350" font-size="11" fill="#555">Единые scout.Result + Hit; MapIDs / Map заполняют модели</text>
  <text x="60" y="374" font-size="11" fill="#555">Manager.Driver(name) — лениво, с кэшем; Extend добавляет движки</text>
  <text x="60" y="398" font-size="11" fill="#555">attachMeta выравнивает по KeyString — набор моделей не сдвигается</text>
  <text x="60" y="422" font-size="11" fill="#555">Ошибки: неизвестный драйвер / неоперация → scout.ErrNotSupported</text>

  <!-- Панель D: намеренные упрощения ponytail -->
  <rect x="480" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Намеренные упрощения ponytail</text>
  <text x="500" y="326" font-size="11" fill="#555">Очередь в процессе вместо Redis; MemorySource O(ids×models)</text>
  <text x="500" y="350" font-size="11" fill="#555">whereNotIns в Algolia — no-op "0=1"; единая структура v3/v4 + флаг версии</text>
  <text x="500" y="374" font-size="11" fill="#555">Только стандартная библиотека; SQL-идентификаторы по белому списку</text>
  <text x="500" y="398" font-size="11" fill="#555">Упрощения помечены ponytail-комментариями: потолок и путь обновления</text>
  <text x="500" y="422" font-size="11" fill="#555">Путь обновления: Redis-очередь / индексные таблицы / структуры на движок</text>

  <!-- Нижняя линия потока -->
  <rect x="40" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="120" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">Намерение запроса</text>
  <line x1="204" y1="532" x2="248" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="252" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="332" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">Представление DSL</text>
  <line x1="416" y1="532" x2="460" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="464" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="544" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">Адаптация движка</text>
  <line x1="628" y1="532" x2="672" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="756" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Нормализация результатов</text>
</svg>
