  <text x="181" y="360" text-anchor="middle" font-size="11" fill="#555">Where · OrderBy · Take · WithTrashed …</text>
  <rect x="330" y="322" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="455" y="344" text-anchor="middle" font-size="14" fill="#3a3a3a">실행 메서드（builder_search.go）</text>
  <text x="455" y="360" text-anchor="middle" font-size="11" fill="#555">Get · First · Paginate · Cursor · Keys</text>
  <rect x="604" y="322" width="290" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="749" y="344" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.Result · PaginationResult</text>
  <text x="749" y="360" text-anchor="middle" font-size="11" fill="#555">Hits · Total · Aggregations · Raw</text>
  <line x1="480" y1="380" x2="480" y2="400" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 엔진 어댑터 계층 -->
