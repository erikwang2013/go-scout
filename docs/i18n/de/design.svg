<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <title>go-scout Design-Prinzipien-Diagramm</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">go-scout Design-Prinzipien</text>

  <!-- Panel A: Fluent-Builder -->
  <rect x="40" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Der Fluent-Builder trägt die Query-Absicht</text>
  <text x="60" y="106" font-size="11" fill="#555">Search(ctx, query, cb) liefert *Builder; Chaining akkumuliert nur Zustand</text>
  <text x="60" y="130" font-size="11" fill="#555">Erst Get / First / Paginate / Cursor lösen einen Engine-Roundtrip aus</text>
  <text x="60" y="154" font-size="11" fill="#555">QueryCB ändert die Query, CallbackCB sieht den Request-Body,</text>
  <text x="60" y="174" font-size="11" fill="#555">AddResultProcessor verarbeitet die Ergebnisse nach</text>
  <text x="60" y="206" font-size="11" fill="#d8d4c8">—</text>
  <text x="60" y="222" font-size="11" fill="#555">Suchfelder: Options["fields"] → FullTextColumner → FieldNames</text>

  <!-- Panel B: DSL-Zwischendarstellung -->
  <rect x="480" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">DSL-Zwischendarstellung</text>
  <text x="500" y="106" font-size="11" fill="#555">Erweiterte Bedingungen → Bool-Query-JSON via engines/dsl.go</text>
  <text x="500" y="130" font-size="11" fill="#555">ES / OpenSearch konsumieren direkt; meilisearch / typesense /</text>
  <text x="500" y="150" font-size="11" fill="#555">algolia / database übersetzen in ihre eigene Syntax</text>
  <text x="500" y="174" font-size="11" fill="#555">MapBooleanToBoolKey: and/or/not → filter/should/must_not</text>
  <text x="500" y="198" font-size="11" fill="#555">Eine API für erweiterte Queries; Engine-Differenzen im Übersetzer</text>

  <!-- Panel C: Interface-Isolation -->
  <rect x="40" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Isolation der Engine-Interfaces</text>
  <text x="60" y="326" font-size="11" fill="#555">Engine / AdvancedEngine: nur Dokumente &amp; Ergebnisse,</text>
  <text x="60" y="350" font-size="11" fill="#555">nie Modelltypen — MapIDs / Map befüllen Modelle</text>
  <text x="60" y="374" font-size="11" fill="#555">Manager.Driver(name) lazy erstellt &amp; gecacht, jederzeit Extend</text>
  <text x="60" y="398" font-size="11" fill="#555">attachMeta richtet per KeyString aus — kein Verrutschen bei</text>
  <text x="60" y="422" font-size="11" fill="#555">gefilterten Modellmengen; Fehler → scout.ErrNotSupported</text>

  <!-- Panel D: ponytail-Vereinfachungen -->
  <rect x="480" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Bewusste ponytail-Vereinfachungen</text>
  <text x="500" y="326" font-size="11" fill="#555">Prozessinterne Queue statt Redis; MemorySource linear O(ids×models)</text>
  <text x="500" y="350" font-size="11" fill="#555">algolia whereNotIns als "0=1"-No-op; v3/v4 ein Struct + Flag</text>
  <text x="500" y="374" font-size="11" fill="#555">Nur Stdlib ohne Deps; SQL-Identifier-Whitelist gegen Injection</text>
  <text x="500" y="398" font-size="11" fill="#555">Jede Vereinfachung trägt ponytail-Kommentar: Grenzen &amp; Pfad</text>
  <text x="500" y="422" font-size="11" fill="#555">Upgrade-Pfad: Redis-Queue / Index-Tabellen / Structs pro Engine</text>

  <!-- Unterer Ablauf -->
  <rect x="40" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="120" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">Query-Absicht</text>
  <line x1="204" y1="532" x2="248" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="252" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="332" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">DSL-Zwischendarstellung</text>
  <line x1="416" y1="532" x2="460" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="464" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="544" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">Engine-Adapter</text>
  <line x1="628" y1="532" x2="672" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="756" y="536" text-anchor="middle" font-size="13" fill="#3a3a3a">Ergebnis-Normalisierung</text>
</svg>
