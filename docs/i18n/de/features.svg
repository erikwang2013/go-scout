<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <title>go-scout Funktionen-Diagramm</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">go-scout Funktionen</text>

  <!-- Karte 1: Query-Builder-Kette -->
  <rect x="40" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">Query-Builder-Kette (scout.Builder)</text>
  <text x="60" y="100" font-size="11" fill="#555">Streaming-API: Query · Where · WhereIn · WhereNotIn · OrderBy · Take</text>
  <text x="60" y="120" font-size="11" fill="#555">Erweitert: VectorSearch · WhereRange · WhereGeoDistance · Aggregate</text>
  <text x="60" y="140" font-size="11" fill="#555">Callback-Injektion: QueryCB · CallbackCB · AddResultProcessor</text>

  <!-- Karte 2: DSL-Zwischendarstellung -->
  <rect x="480" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">DSL-Zwischendarstellung (engines/dsl.go)</text>
  <text x="500" y="100" font-size="11" fill="#555">Erweiterte Bedingungen → Bool-Query-JSON (must · filter · should)</text>
  <text x="500" y="120" font-size="11" fill="#555">multi_match · term · range · geo_distance · wildcard · regexp …</text>
  <text x="500" y="140" font-size="11" fill="#555">ES / OpenSearch gemeinsam; MapBooleanToBoolKey mappt and/or/not</text>

  <!-- Karte 3: Paginierung & Cursor -->
  <rect x="40" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Paginierung &amp; Cursor</text>
  <text x="60" y="232" font-size="11" fill="#555">Paginate · SimplePaginate · Cursor-Lazy-Streaming</text>
  <text x="60" y="252" font-size="11" fill="#555">PaginationResult: LastPage · HasMorePages · AppendQuery</text>
  <text x="60" y="272" font-size="11" fill="#555">Result.As[T] / GetAs[T] auf Paketebene (Generics)</text>

  <!-- Karte 4: Soft Deletes -->
  <rect x="480" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Soft Deletes</text>
  <text x="500" y="232" font-size="11" fill="#555">__soft_deleted-Metadaten im Dokument (0 / 1)</text>
  <text x="500" y="252" font-size="11" fill="#555">OnlyTrashed / WithTrashed filtern Queries</text>
  <text x="500" y="272" font-size="11" fill="#555">Observer-Deleted-Zweig · ForceDeleted / Restored</text>

  <!-- Karte 5: Async-Queue -->
  <rect x="40" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Async-Queue (scout.Queue)</text>
  <text x="60" y="364" font-size="11" fill="#555">Prozessinterne Queue: chan-Puffer 4096 + Worker-Goroutinen</text>
  <text x="60" y="384" font-size="11" fill="#555">Sync-Fallback mit Warnung, wenn Queue fehlt</text>
  <text x="60" y="404" font-size="11" fill="#555">MakeAllSearchable Chunk-Import (Standard 500)</text>

  <!-- Karte 6: Events & Observer -->
  <rect x="480" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Events &amp; Observer</text>
  <text x="500" y="364" font-size="11" fill="#555">ModelObserver synct automatisch: Saved · Deleted · Restored</text>
  <text x="500" y="384" font-size="11" fill="#555">EventBus veröffentlicht models_imported · models_flushed</text>
  <text x="500" y="404" font-size="11" fill="#555">WithoutSyncingToSearch deaktiviert Sync temporär</text>

  <!-- Karte 7: Multi-Engine-Registrierung -->
  <rect x="40" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Multi-Engine-Registrierung (EngineManager)</text>
  <text x="60" y="496" font-size="11" fill="#555">Extend + engines.Register registrieren 16 Treibernamen</text>
  <text x="60" y="516" font-size="11" fill="#555">Treiber lazy erstellt &amp; gecacht; unbekannt → ErrNotSupported</text>
  <text x="60" y="536" font-size="11" fill="#555">Engine-Wechsel nur über SCOUT_DRIVER</text>

  <!-- Karte 8: Erweiterte Suche -->
  <rect x="480" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Erweiterte Suche (AdvancedEngine)</text>
  <text x="500" y="496" font-size="11" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <text x="500" y="516" font-size="11" fill="#555">Vektor-Ähnlichkeit · Bereich · Geo-Distanz-Filter &amp; Sortierung</text>
  <text x="500" y="536" font-size="11" fill="#555">Aggregate + Facets + Highlighting</text>

  <!-- Untere Leiste -->
  <rect x="40" y="582" width="880" height="36" rx="8" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="605" text-anchor="middle" font-size="13" fill="#3a3a3a">Reine Standardbibliothek · 0 Drittanbieter-Abhängigkeiten · Go 1.24 · Port von webman/laravel-scout</text>
  <!-- go-scout 项目宠物小侦 / mascot signature -->
  <g transform="translate(22,2) scale(0.24)">
    <g fill="none" stroke="#2f6f6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M 136.8 31.1 A 22 22 0 0 1 150.9 45.2"/>
      <path d="M 140.5 19.7 A 34 34 0 0 1 162.3 41.5" opacity=".7"/>
      <path d="M 144.2 8.3 A 46 46 0 0 1 173.7 37.8" opacity=".45"/>
    </g>
    <line x1="130" y1="82" x2="130" y2="58" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="52" r="8" fill="#2f6f6a" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="127.4" cy="49.4" r="2.4" fill="#ffffff" opacity=".9"/>
    <circle cx="130" cy="130" r="50" fill="#dbe8e5" stroke="#4a4a4a" stroke-width="7"/>
    <path d="M 96.2 117.7 A 36 36 0 0 1 117.7 96.2" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <circle cx="114" cy="132" r="7" fill="#3a3a3a"/>
    <circle cx="146" cy="132" r="7" fill="#3a3a3a"/>
    <path d="M 118 152 Q 130 162 142 152" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
