<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>Funcionalidades do go-scout</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Funcionalidades do go-scout</text>

  <!-- Cartão 1 : encadeamento de consultas -->
  <rect x="40" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">Cadeia de consultas (scout.Builder)</text>
  <text x="60" y="100" font-size="10" fill="#555">API fluida: Query · Where · WhereIn · WhereNotIn · OrderBy · Take</text>
  <text x="60" y="120" font-size="10" fill="#555">Avançado: VectorSearch · WhereRange · WhereGeoDistance · Aggregate</text>
  <text x="60" y="140" font-size="10" fill="#555">Callbacks: QueryCB · CallbackCB · AddResultProcessor</text>

  <!-- Cartão 2 : representação intermediária DSL -->
  <rect x="480" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">IR de DSL (engines/dsl.go)</text>
  <text x="500" y="100" font-size="10" fill="#555">Condições avançadas → bool query JSON (must · filter · should)</text>
  <text x="500" y="120" font-size="10" fill="#555">multi_match · term · range · geo_distance · wildcard · regexp …</text>
  <text x="500" y="140" font-size="10" fill="#555">ES / OpenSearch compartilham; MapBooleanToBoolKey mapeia and/or/not</text>

  <!-- Cartão 3 : paginação e cursor -->
  <rect x="40" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Paginação e cursor</text>
  <text x="60" y="232" font-size="10" fill="#555">Paginate · SimplePaginate · Cursor com iteração preguiçosa</text>
  <text x="60" y="252" font-size="10" fill="#555">PaginationResult: LastPage · HasMorePages · AppendQuery</text>
  <text x="60" y="272" font-size="10" fill="#555">Result.As[T] / GetAs[T] genérico para obter models</text>

  <!-- Cartão 4 : soft delete -->
  <rect x="480" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">Soft delete</text>
  <text x="500" y="232" font-size="10" fill="#555">Metadados __soft_deleted no documento (0 / 1)</text>
  <text x="500" y="252" font-size="10" fill="#555">Filtros de consulta OnlyTrashed / WithTrashed</text>
  <text x="500" y="272" font-size="10" fill="#555">Ramo Deleted do observer · ForceDeleted / Restored</text>

  <!-- Cartão 5 : fila assíncrona -->
  <rect x="40" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Fila assíncrona (scout.Queue)</text>
  <text x="60" y="364" font-size="10" fill="#555">Fila em processo: chan com buffer 4096 + goroutines</text>
  <text x="60" y="384" font-size="10" fill="#555">Fallback síncrono com aviso quando a fila está indisponível</text>
  <text x="60" y="404" font-size="10" fill="#555">MakeAllSearchable importa em lotes (default 500)</text>

  <!-- Cartão 6 : eventos e observadores -->
  <rect x="480" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">Eventos e observadores</text>
  <text x="500" y="364" font-size="10" fill="#555">ModelObserver escuta Saved · Deleted · Restored</text>
  <text x="500" y="384" font-size="10" fill="#555">EventBus publica models_imported · models_flushed</text>
  <text x="500" y="404" font-size="10" fill="#555">WithoutSyncingToSearch desativa a sincronização temporariamente</text>

  <!-- Cartão 7 : registro multi-mecanismo -->
  <rect x="40" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Registro multi-motor (EngineManager)</text>
  <text x="60" y="496" font-size="10" fill="#555">Extend + engines.Register: 16 drivers</text>
  <text x="60" y="516" font-size="10" fill="#555">Drivers preguiçosos + cache; desconhecido → ErrNotSupported</text>
  <text x="60" y="536" font-size="10" fill="#555">Trocar de mecanismo exige apenas SCOUT_DRIVER</text>

  <!-- Cartão 8 : busca avançada -->
  <rect x="480" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">Busca avançada (AdvancedEngine)</text>
  <text x="500" y="496" font-size="10" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <text x="500" y="516" font-size="10" fill="#555">Similaridade vetorial · intervalos · filtros e ordenação geo</text>
  <text x="500" y="536" font-size="10" fill="#555">Agregações (Aggregate) + facetas (Facet) + highlight</text>

  <!-- Rodapé -->
  <rect x="40" y="582" width="880" height="36" rx="8" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="605" text-anchor="middle" font-size="12" fill="#3a3a3a">100 % biblioteca padrão · zero dependências · Go 1.24 · portado de webman/laravel-scout</text>
  <!-- go-scout 项目宠物小侦 / mascot signature -->
  <g transform="translate(22,2) scale(0.24)">
    <g fill="none" stroke="#2f6f6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M 136.8 31.1 A 22 22 0 0 1 150.9 45.2"/>
      <path d="M 140.5 19.7 A 34 34 0 0 1 162.3 41.5" opacity=".7"/>
      <path d="M 144.2 8.3 A 46 46 0 0 1 173.7 37.8" opacity=".45"/>
    </g>
    <line x1="130" y1="82" x2="130" y2="58" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="52" r="8" fill="#2f6f6a" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="127.4" cy="49.4" r="2.4" fill="#ffffff" opacity=".9"/>
    <circle cx="130" cy="130" r="50" fill="#dbe8e5" stroke="#4a4a4a" stroke-width="7"/>
    <path d="M 96.2 117.7 A 36 36 0 0 1 117.7 96.2" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <circle cx="114" cy="132" r="7" fill="#3a3a3a"/>
    <circle cx="146" cy="132" r="7" fill="#3a3a3a"/>
    <path d="M 118 152 Q 130 162 142 152" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
