<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>Filosofia de design do go-scout</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Filosofia de design do go-scout</text>

  <!-- Painel A : Builder encadeado -->
  <rect x="40" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">O Builder encadeado carrega a intenção</text>
  <text x="60" y="106" font-size="10" fill="#555">Search(ctx, query, cb) retorna *Builder; o encadeamento só acumula estado</text>
  <text x="60" y="130" font-size="10" fill="#555">Get / First / Paginate / Cursor disparam uma ida ao mecanismo</text>
  <text x="60" y="154" font-size="10" fill="#555">QueryCB modifica a consulta · CallbackCB captura o corpo,</text>
  <text x="60" y="174" font-size="10" fill="#555">AddResultProcessor pós-processa os resultados</text>
  <text x="60" y="206" font-size="11" fill="#d8d4c8">—</text>
  <text x="60" y="222" font-size="10" fill="#555">Campos: Options["fields"] → FullTextColumner → FieldNames</text>

  <!-- Painel B : representação intermediária DSL -->
  <rect x="480" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Representação intermediária DSL</text>
  <text x="500" y="106" font-size="10" fill="#555">Condições avançadas compiladas para bool query JSON (dsl.go)</text>
  <text x="500" y="130" font-size="10" fill="#555">ES / OpenSearch direto; meilisearch / typesense /</text>
  <text x="500" y="150" font-size="10" fill="#555">algolia / database traduzem para a própria sintaxe</text>
  <text x="500" y="174" font-size="10" fill="#555">MapBooleanToBoolKey: and/or/not → filter/should/must_not</text>
  <text x="500" y="198" font-size="10" fill="#555">API avançada única; diferenças confinadas à tradução</text>

  <!-- Painel C : isolamento por interface -->
  <rect x="40" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Isolamento por interface do mecanismo</text>
  <text x="60" y="326" font-size="10" fill="#555">Engine / AdvancedEngine só falam de docs e resultados</text>
  <text x="60" y="350" font-size="10" fill="#555">scout.Result + Hit unificados; MapIDs / Map preenchem models</text>
  <text x="60" y="374" font-size="10" fill="#555">Manager.Driver(name) preguiçoso + cache; Extend a qualquer momento</text>
  <text x="60" y="398" font-size="10" fill="#555">attachMeta alinha por KeyString; sem desalinhamento</text>
  <text x="60" y="422" font-size="10" fill="#555">Erros: driver desconhecido / opção não suportada → ErrNotSupported</text>

  <!-- Painel D : simplificações ponytail -->
  <rect x="480" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Simplificações ponytail deliberadas</text>
  <text x="500" y="326" font-size="10" fill="#555">Fila em processo em vez de Redis; MemorySource O(ids×models)</text>
  <text x="500" y="350" font-size="10" fill="#555">algolia whereNotIns no-op "0=1"; v3/v4 única + flag</text>
  <text x="500" y="374" font-size="10" fill="#555">Somente stdlib; identificadores SQL na lista branca</text>
  <text x="500" y="398" font-size="10" fill="#555">Limites e rotas de melhoria marcadas com ponytail</text>
  <text x="500" y="422" font-size="10" fill="#555">Melhoria: fila Redis / tabela de índice / estrutura por mecanismo</text>

  <!-- Fluxo inferior -->
  <rect x="40" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="120" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Intenção da consulta</text>
  <line x1="204" y1="532" x2="248" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="252" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="332" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">IR de DSL</text>
  <line x1="416" y1="532" x2="460" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="464" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="544" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Adaptação do mecanismo</text>
  <line x1="628" y1="532" x2="672" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="756" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Resultados normalizados</text>
</svg>
