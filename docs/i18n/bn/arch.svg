  <text x="749" y="478" text-anchor="middle" font-size="10" fill="#555">Extend · লেজি Driver + ক্যাশ</text>
  <line x1="480" y1="498" x2="480" y2="518" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

