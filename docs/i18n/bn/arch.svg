  <rect x="434" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">opensearch</text>
  <text x="480" y="596" text-anchor="middle" font-size="9" fill="#555">REST + DSL</text>
  <rect x="530" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
