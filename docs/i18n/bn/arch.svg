<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="'Noto Sans Bengali',sans-serif">
  <title>go-scout — আর্কিটেকচার স্তর</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">go-scout — আর্কিটেকচার স্তর</text>

  <!-- মডেল স্তর -->
  <rect x="40" y="48" width="880" height="96" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="62" y="72" font-size="14" font-weight="bold" fill="#3a3a3a">মডেল স্তর · ডেটা ও মডেল</text>
  <rect x="56" y="86" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="181" y="108" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.ScoutModel</text>
  <text x="181" y="124" text-anchor="middle" font-size="10" fill="#555">ScoutKey · ToSearchableArray · ShouldBeSearchable</text>
  <rect x="330" y="86" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="455" y="108" text-anchor="middle" font-size="12" fill="#3a3a3a">scout.Source[T] — ডেটা সোর্স</text>
  <text x="455" y="124" text-anchor="middle" font-size="10" fill="#555">All · ByIDs · Count (MemorySource উদাহরণ)</text>
  <rect x="604" y="86" width="290" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="749" y="108" text-anchor="middle" font-size="13" fill="#3a3a3a">ঐচ্ছিক এক্সটেনশন ইন্টারফেস</text>
  <text x="749" y="124" text-anchor="middle" font-size="11" fill="#555">SoftDeleter · FullTextColumner · PrefixColumner …</text>
