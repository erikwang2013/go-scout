<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'Noto Sans Bengali',sans-serif">
  <title>go-scout — বৈশিষ্ট্যসমূহ</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">go-scout — বৈশিষ্ট্যসমূহ</text>

  <!-- কার্ড 1: কোয়েরি নির্মাণ চেইন -->
  <rect x="40" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">কোয়েরি নির্মাণ চেইন (scout.Builder)</text>
  <text x="60" y="100" font-size="11" fill="#555">ফ্লো API: Query · Where · WhereIn · WhereNotIn · OrderBy · Take</text>
  <text x="60" y="120" font-size="11" fill="#555">অ্যাডভান্সড: VectorSearch · WhereRange · WhereGeoDistance · Aggregate</text>
  <text x="60" y="140" font-size="11" fill="#555">কলব্যাক ইনজেকশন: QueryCB · CallbackCB · AddResultProcessor</text>

  <!-- কার্ড 2: DSL মধ্যবর্তী উপস্থাপনা -->
  <rect x="480" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">DSL মধ্যবর্তী উপস্থাপনা (engines/dsl.go)</text>
  <text x="500" y="100" font-size="11" fill="#555">অ্যাডভান্সড শর্ত → bool-কোয়েরি JSON (must · filter · should)</text>
  <text x="500" y="120" font-size="11" fill="#555">multi_match · term · range · geo_distance · wildcard · regexp …</text>
  <text x="500" y="140" font-size="11" fill="#555">ES / OpenSearch সাঁঝা; MapBooleanToBoolKey ম্যাপ করে and/or/not</text>

  <!-- কার্ড 3: পেজিনেশন ও কার্সর -->
  <rect x="40" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">পেজিনেশন ও কার্সর</text>
  <text x="60" y="232" font-size="11" fill="#555">Paginate · SimplePaginate · Cursor — লেজি স্ট্রিম ট্র্যাভার্সাল</text>
  <text x="60" y="252" font-size="11" fill="#555">PaginationResult: LastPage · HasMorePages · AppendQuery</text>
  <text x="60" y="272" font-size="11" fill="#555">Result.As[T] / প্যাকেজ জেনেরিক GetAs[T] দিয়ে মডেল প্রাপ্তি</text>

  <!-- কার্ড 4: সফট ডিলিট -->
  <rect x="480" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">সফট ডিলিট</text>
  <text x="500" y="232" font-size="11" fill="#555">__soft_deleted মেটাডেটা ডকুমেন্টসহ ইনডেক্সে (0 / 1)</text>
  <text x="500" y="252" font-size="11" fill="#555">কোয়েরি ফিল্টার: OnlyTrashed / WithTrashed</text>
  <text x="500" y="272" font-size="11" fill="#555">অবজার্ভার Deleted শাখা · ForceDeleted / Restored</text>

  <!-- কার্ড 5: অ্যাসিংক কিউ -->
  <rect x="40" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">অ্যাসিংক কিউ (scout.Queue)</text>
  <text x="60" y="364" font-size="11" fill="#555">ইন-প্রসেস কিউ: chan বাফার 4096 + ওয়ার্কার গোরুটিন</text>
  <text x="60" y="384" font-size="11" fill="#555">কিউ না থাকলে সতর্কতাসহ সিঙ্ক ফলব্যাক</text>
  <text x="60" y="404" font-size="11" fill="#555">MakeAllSearchable চাঙ্কে ইমপোর্ট (ডিফল্ট ৫০০)</text>

  <!-- কার্ড 6: ইভেন্ট ও অবজার্ভার -->
  <rect x="480" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">ইভেন্ট ও অবজার্ভার</text>
  <text x="500" y="364" font-size="11" fill="#555">ModelObserver শোনে Saved · Deleted · Restored — স্বয়ংক্রিয় সিঙ্ক</text>
  <text x="500" y="384" font-size="11" fill="#555">EventBus প্রকাশ করে models_imported · models_flushed</text>
  <text x="500" y="404" font-size="11" fill="#555">WithoutSyncingToSearch সাময়িকভাবে সিঙ্ক বন্ধ করে</text>

  <!-- কার্ড 7: মাল্টি-ইঞ্জিন নিবন্ধন -->
  <rect x="40" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">মাল্টি-ইঞ্জিন নিবন্ধন (EngineManager)</text>
  <text x="60" y="496" font-size="11" fill="#555">Extend + engines.Register — ১৬টি ড্রাইভার নাম নিবন্ধিত</text>
  <text x="60" y="516" font-size="11" fill="#555">ড্রাইভার লেজি + ক্যাশ; অজানা ড্রাইভার → ErrNotSupported</text>
  <text x="60" y="536" font-size="11" fill="#555">ইঞ্জিন বদলানো = শুধু SCOUT_DRIVER বদলানো</text>

  <!-- কার্ড 8: অ্যাডভান্সড সার্চ -->
  <rect x="480" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">অ্যাডভান্সড সার্চ (AdvancedEngine)</text>
  <text x="500" y="496" font-size="11" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <text x="500" y="516" font-size="11" fill="#555">ভেক্টর সাদৃশ্য · রেঞ্জ · জিও-দূরত্ব ফিল্টার/সর্ট</text>
  <text x="500" y="536" font-size="11" fill="#555">এগ্রিগেশন (Aggregate) + ফ্যাসেট (Facet) + হাইলাইট</text>

  <!-- নিচের বার -->
  <rect x="40" y="582" width="880" height="36" rx="8" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="605" text-anchor="middle" font-size="13" fill="#3a3a3a">শুধু স্ট্যান্ডার্ড লাইব্রেরি · শূন্য ডিপেন্ডেন্সি · Go 1.24 · পোর্ট webman/laravel-scout</text>
  <!-- go-scout 项目宠物小侦 / mascot signature -->
  <g transform="translate(22,2) scale(0.24)">
    <g fill="none" stroke="#2f6f6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M 136.8 31.1 A 22 22 0 0 1 150.9 45.2"/>
      <path d="M 140.5 19.7 A 34 34 0 0 1 162.3 41.5" opacity=".7"/>
      <path d="M 144.2 8.3 A 46 46 0 0 1 173.7 37.8" opacity=".45"/>
    </g>
    <line x1="130" y1="82" x2="130" y2="58" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="52" r="8" fill="#2f6f6a" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="127.4" cy="49.4" r="2.4" fill="#ffffff" opacity=".9"/>
    <circle cx="130" cy="130" r="50" fill="#dbe8e5" stroke="#4a4a4a" stroke-width="7"/>
    <path d="M 96.2 117.7 A 36 36 0 0 1 117.7 96.2" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <circle cx="114" cy="132" r="7" fill="#3a3a3a"/>
    <circle cx="146" cy="132" r="7" fill="#3a3a3a"/>
    <path d="M 118 152 Q 130 162 142 152" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
