<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>Architecture en couches de go-scout</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Architecture en couches de go-scout</text>

  <!-- Couche modèle -->
  <rect x="40" y="48" width="880" height="96" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="62" y="72" font-size="14" font-weight="bold" fill="#3a3a3a">Couche modèle · données et modèles</text>
  <rect x="56" y="86" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="181" y="108" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.ScoutModel</text>
  <text x="181" y="124" text-anchor="middle" font-size="11" fill="#555">ScoutKey · ToSearchableArray · ShouldBeSearchable</text>
  <rect x="330" y="86" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="455" y="108" text-anchor="middle" font-size="12" fill="#3a3a3a">scout.Source[T] sources de données</text>
  <text x="455" y="124" text-anchor="middle" font-size="10" fill="#555">All · ByIDs · Count (ex. MemorySource)</text>
  <rect x="604" y="86" width="290" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="749" y="108" text-anchor="middle" font-size="14" fill="#3a3a3a">Interfaces optionnelles</text>
  <text x="749" y="124" text-anchor="middle" font-size="9" fill="#555">SoftDeleter · FullTextColumner · PrefixColumner …</text>
  <line x1="480" y1="144" x2="480" y2="164" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Couche de synchronisation -->
  <rect x="40" y="166" width="880" height="96" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="62" y="190" font-size="14" font-weight="bold" fill="#3a3a3a">Couche de synchro · observateurs et événements</text>
  <rect x="56" y="204" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="181" y="226" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.ModelObserver</text>
  <text x="181" y="242" text-anchor="middle" font-size="10" fill="#555">Sync auto : Saved · Deleted · Restored</text>
  <rect x="330" y="204" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="455" y="226" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.EventBus</text>
  <text x="455" y="242" text-anchor="middle" font-size="11" fill="#555">models_imported · models_flushed</text>
  <rect x="604" y="204" width="290" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="749" y="226" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.Queue file asynchrone</text>
  <text x="749" y="242" text-anchor="middle" font-size="10" fill="#555">Tampon 4096 · repli synchrone si indisponible</text>
  <line x1="480" y1="262" x2="480" y2="282" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Couche requête -->
  <rect x="40" y="284" width="880" height="96" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="62" y="308" font-size="14" font-weight="bold" fill="#3a3a3a">Couche requête · construction et exécution</text>
  <rect x="56" y="322" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="181" y="344" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.Builder requête chaînée</text>
  <text x="181" y="360" text-anchor="middle" font-size="11" fill="#555">Where · OrderBy · Take · WithTrashed …</text>
  <rect x="330" y="322" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="455" y="344" text-anchor="middle" font-size="12" fill="#3a3a3a">Exécution (builder_search.go)</text>
  <text x="455" y="360" text-anchor="middle" font-size="11" fill="#555">Get · First · Paginate · Cursor · Keys</text>
  <rect x="604" y="322" width="290" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="749" y="344" text-anchor="middle" font-size="14" fill="#3a3a3a">scout.Result · PaginationResult</text>
  <text x="749" y="360" text-anchor="middle" font-size="11" fill="#555">Hits · Total · Aggregations · Raw</text>
  <line x1="480" y1="380" x2="480" y2="400" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Couche d'adaptation des moteurs -->
  <rect x="40" y="402" width="880" height="96" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="62" y="426" font-size="14" font-weight="bold" fill="#3a3a3a">Couche d'adaptation · isolation par interface</text>
  <rect x="56" y="440" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="181" y="462" text-anchor="middle" font-size="14" fill="#3a3a3a">Interface Engine</text>
  <text x="181" y="478" text-anchor="middle" font-size="11" fill="#555">Search · Paginate · Update · Delete · Map</text>
  <rect x="330" y="440" width="250" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="455" y="462" text-anchor="middle" font-size="14" fill="#3a3a3a">Interface AdvancedEngine</text>
  <text x="455" y="478" text-anchor="middle" font-size="11" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <rect x="604" y="440" width="290" height="46" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="749" y="462" text-anchor="middle" font-size="14" fill="#3a3a3a">EngineManager</text>
  <text x="749" y="478" text-anchor="middle" font-size="10" fill="#555">Extend + Driver paresseux (cache)</text>
  <line x1="480" y1="498" x2="480" y2="518" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Couche des moteurs -->
  <rect x="40" y="520" width="880" height="110" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="62" y="544" font-size="14" font-weight="bold" fill="#3a3a3a">Couche moteurs · package engines/</text>
  <rect x="50" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="96" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">null</text>
  <text x="96" y="596" text-anchor="middle" font-size="10" fill="#555">vide · défaut</text>
  <rect x="146" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="192" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">collection</text>
  <text x="192" y="596" text-anchor="middle" font-size="9" fill="#555">recherche mémoire</text>
  <rect x="242" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="288" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">database</text>
  <text x="288" y="596" text-anchor="middle" font-size="9" fill="#555">table = index SQL</text>
  <rect x="338" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="384" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">elasticsearch</text>
  <text x="384" y="596" text-anchor="middle" font-size="10" fill="#555">REST + DSL</text>
  <rect x="434" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">opensearch</text>
  <text x="480" y="596" text-anchor="middle" font-size="10" fill="#555">REST + DSL</text>
  <rect x="530" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="576" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">meilisearch</text>
  <text x="576" y="596" text-anchor="middle" font-size="8.5" fill="#555">vecteur · hybride</text>
  <rect x="626" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="672" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">typesense</text>
  <text x="672" y="596" text-anchor="middle" font-size="8.5" fill="#555">agrégats · groupes</text>
  <rect x="722" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="768" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">algolia</text>
  <text x="768" y="596" text-anchor="middle" font-size="10" fill="#555">REST v3/v4</text>
  <rect x="818" y="556" width="92" height="56" rx="6" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="864" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">xunsearch</text>
  <text x="864" y="596" text-anchor="middle" font-size="9" fill="#555">démon HTTP</text>
</svg>
