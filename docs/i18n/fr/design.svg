<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>Philosophie de conception de go-scout</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Philosophie de conception de go-scout</text>

  <!-- Panneau A : Builder chaîné -->
  <rect x="40" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Le Builder chaîné porte l'intention</text>
  <text x="60" y="106" font-size="10" fill="#555">Search(ctx, query, cb) renvoie *Builder ; le chaînage n'accumule que l'état</text>
  <text x="60" y="130" font-size="10" fill="#555">Get / First / Paginate / Cursor déclenchent un seul aller-retour moteur</text>
  <text x="60" y="154" font-size="10" fill="#555">QueryCB modifie la requête · CallbackCB intercepte le corps,</text>
  <text x="60" y="174" font-size="10" fill="#555">AddResultProcessor post-traite les résultats</text>
  <text x="60" y="206" font-size="11" fill="#d8d4c8">—</text>
  <text x="60" y="222" font-size="10" fill="#555">Champs : Options["fields"] → FullTextColumner → FieldNames</text>

  <!-- Panneau B : DSL intermédiaire -->
  <rect x="480" y="52" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="52" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Représentation intermédiaire DSL</text>
  <text x="500" y="106" font-size="10" fill="#555">Conditions avancées compilées en bool query JSON (engines/dsl.go)</text>
  <text x="500" y="130" font-size="10" fill="#555">ES / OpenSearch consomment directement ; meilisearch / typesense /</text>
  <text x="500" y="150" font-size="10" fill="#555">algolia / database traduisent chacune de son côté</text>
  <text x="500" y="174" font-size="10" fill="#555">MapBooleanToBoolKey : and/or/not → filter/should/must_not</text>
  <text x="500" y="198" font-size="10" fill="#555">Une API avancée unique ; différences confinées à la traduction</text>

  <!-- Panneau C : isolation par interface -->
  <rect x="40" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="40" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Isolation par interface moteur</text>
  <text x="60" y="326" font-size="10" fill="#555">Engine / AdvancedEngine ne connaissent ni modèles ni types</text>
  <text x="60" y="350" font-size="10" fill="#555">scout.Result + Hit unifiés ; MapIDs / Map remplissent les modèles</text>
  <text x="60" y="374" font-size="10" fill="#555">Manager.Driver(name) paresseux + cache ; Extend à tout moment</text>
  <text x="60" y="398" font-size="10" fill="#555">attachMeta aligne via KeyString : pas de désynchronisation</text>
  <text x="60" y="422" font-size="10" fill="#555">Erreurs : pilote inconnu / opération non supportée → ErrNotSupported</text>

  <!-- Panneau D : simplifications ponytail -->
  <rect x="480" y="272" width="440" height="200" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="480" y="272" width="440" height="30" rx="8" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="700" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Simplifications ponytail assumées</text>
  <text x="500" y="326" font-size="10" fill="#555">File in-process plutôt que Redis ; MemorySource O(ids×models)</text>
  <text x="500" y="350" font-size="10" fill="#555">algolia whereNotIns no-op "0=1" ; v3/v4 structure unique + drapeau</text>
  <text x="500" y="374" font-size="10" fill="#555">100 % stdlib ; identifiants SQL en liste blanche anti-injection</text>
  <text x="500" y="398" font-size="10" fill="#555">Limites et chemins de mise à niveau notés en ponytail</text>
  <text x="500" y="422" font-size="10" fill="#555">Évolution : file Redis / table d'index / structures par moteur</text>

  <!-- Flux en bas -->
  <rect x="40" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="120" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Intention de requête</text>
  <line x1="204" y1="532" x2="248" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="252" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="332" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">DSL intermédiaire</text>
  <line x1="416" y1="532" x2="460" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="464" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="544" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Adaptation moteur</text>
  <line x1="628" y1="532" x2="672" y2="532" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="510" width="160" height="44" rx="22" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="756" y="536" text-anchor="middle" font-size="12" fill="#3a3a3a">Résultats normalisés</text>
</svg>
