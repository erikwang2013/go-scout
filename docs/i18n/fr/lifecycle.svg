<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>Cycle de vie recherche + synchro de go-scout</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">Cycle de vie recherche + synchro de go-scout</text>

  <!-- Barre latérale : écriture -->
  <rect x="40" y="48" width="250" height="452" rx="8" fill="#f7f6f2" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="165" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3a3a">Chemin d'écriture (synchro)</text>
  <rect x="56" y="90" width="218" height="44" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="165" y="108" text-anchor="middle" font-size="12" fill="#3a3a3a">ModelObserver capture les événements</text>
  <text x="165" y="124" text-anchor="middle" font-size="11" fill="#555">Saved · Deleted · Restored</text>
  <line x1="165" y1="134" x2="165" y2="152" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="154" width="218" height="44" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="165" y="172" text-anchor="middle" font-size="12" fill="#3a3a3a">File d'attente / exécution synchrone</text>
  <text x="165" y="188" text-anchor="middle" font-size="11" fill="#555">Queue.PushNamed (SCOUT_QUEUE)</text>
  <line x1="165" y1="198" x2="165" y2="216" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="218" width="218" height="44" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="165" y="236" text-anchor="middle" font-size="12" fill="#3a3a3a">Synchronisation de l'index</text>
  <text x="165" y="252" text-anchor="middle" font-size="11" fill="#555">engine.Update / Delete + __soft_deleted</text>
  <line x1="165" y1="262" x2="165" y2="280" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="282" width="218" height="44" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="165" y="300" text-anchor="middle" font-size="12" fill="#3a3a3a">EventBus publie les événements</text>
  <text x="165" y="316" text-anchor="middle" font-size="11" fill="#555">models_imported · models_flushed</text>
  <line x1="165" y1="326" x2="165" y2="344" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="346" width="218" height="44" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="165" y="364" text-anchor="middle" font-size="12" fill="#3a3a3a">Import en masse</text>
  <text x="165" y="380" text-anchor="middle" font-size="10" fill="#555">MakeAllSearchable par lots (défaut 500)</text>
  <text x="165" y="426" text-anchor="middle" font-size="10" fill="#555">Exécution synchrone si file désactivée</text>
  <text x="165" y="444" text-anchor="middle" font-size="10" fill="#555">runInline : repli synchrone + alerte</text>

  <!-- Flux principal : recherche -->
  <rect x="340" y="48" width="300" height="44" rx="22" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="74" text-anchor="middle" font-size="14" fill="#3a3a3a">Entrée : Searchable(model, source)</text>
  <line x1="490" y1="92" x2="490" y2="112" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="114" width="300" height="48" rx="6" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="136" text-anchor="middle" font-size="14" fill="#3a3a3a">Construire la requête (*scout.Builder)</text>
  <text x="490" y="154" text-anchor="middle" font-size="11" fill="#555">Query · Where · OrderBy · WithTrashed</text>
  <line x1="490" y1="162" x2="490" y2="182" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="184" width="300" height="48" rx="6" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="206" text-anchor="middle" font-size="14" fill="#3a3a3a">Répartition du moteur</text>
  <text x="490" y="224" text-anchor="middle" font-size="11" fill="#555">Manager.Driver(name) paresseux + cache</text>
  <line x1="490" y1="232" x2="490" y2="252" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="254" width="300" height="48" rx="6" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="276" text-anchor="middle" font-size="14" fill="#3a3a3a">Exécution de la recherche</text>
  <text x="490" y="294" text-anchor="middle" font-size="11" fill="#555">engine.Search / Paginate (REST · SQL · mémoire)</text>
  <line x1="490" y1="302" x2="490" y2="322" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="324" width="300" height="48" rx="6" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="346" text-anchor="middle" font-size="14" fill="#3a3a3a">Analyse de la réponse (scout.Result)</text>
  <text x="490" y="364" text-anchor="middle" font-size="11" fill="#555">Hits · Total · Aggregations · Raw</text>
  <line x1="490" y1="372" x2="490" y2="392" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Losange de décision -->
  <polygon points="490,394 620,426 490,458 360,426" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="424" text-anchor="middle" font-size="14" fill="#3a3a3a">Remplir les modèles ?</text>
  <text x="490" y="442" text-anchor="middle" font-size="11" fill="#555">Get / Paginate / First</text>

  <!-- Non : retour direct -->
  <line x1="620" y1="426" x2="668" y2="426" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="644" y="416" text-anchor="middle" font-size="11" fill="#555">Non</text>
  <rect x="678" y="402" width="242" height="48" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="799" y="424" text-anchor="middle" font-size="12" fill="#3a3a3a">Retour direct (sans charger)</text>
  <text x="799" y="442" text-anchor="middle" font-size="11" fill="#555">Keys · GetAggregations · PaginateRaw</text>

  <!-- Oui : remplissage -->
  <line x1="490" y1="458" x2="490" y2="486" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="478" font-size="11" fill="#555">Oui</text>
  <rect x="340" y="488" width="300" height="64" rx="6" fill="#e3e0d6" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="510" text-anchor="middle" font-size="14" fill="#3a3a3a">Remplir les modèles</text>
  <text x="490" y="530" text-anchor="middle" font-size="11" fill="#555">MapIDs → Source.ByIDs → attachMeta</text>
  <text x="490" y="546" text-anchor="middle" font-size="11" fill="#555">Alignement KeyString · ordre du moteur préservé</text>
  <line x1="490" y1="552" x2="490" y2="572" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="574" width="300" height="44" rx="22" fill="#d8d4c8" stroke="#4a4a4a" stroke-width="2"/>
  <text x="490" y="600" text-anchor="middle" font-size="14" fill="#3a3a3a">Retour : Models / ResultItem</text>
  <!-- go-scout 项目宠物小侦 / mascot signature -->
  <g transform="translate(22,2) scale(0.24)">
    <g fill="none" stroke="#2f6f6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M 136.8 31.1 A 22 22 0 0 1 150.9 45.2"/>
      <path d="M 140.5 19.7 A 34 34 0 0 1 162.3 41.5" opacity=".7"/>
      <path d="M 144.2 8.3 A 46 46 0 0 1 173.7 37.8" opacity=".45"/>
    </g>
    <line x1="130" y1="82" x2="130" y2="58" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="52" r="8" fill="#2f6f6a" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="127.4" cy="49.4" r="2.4" fill="#ffffff" opacity=".9"/>
    <circle cx="130" cy="130" r="50" fill="#dbe8e5" stroke="#4a4a4a" stroke-width="7"/>
    <path d="M 96.2 117.7 A 36 36 0 0 1 117.7 96.2" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <circle cx="114" cy="132" r="7" fill="#3a3a3a"/>
    <circle cx="146" cy="132" r="7" fill="#3a3a3a"/>
    <path d="M 118 152 Q 130 162 142 152" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
