<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'Hiragino Sans','Noto Sans JP','PingFang SC','Microsoft YaHei',sans-serif">
  <title>go-scout 機能の図</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <text x="480" y="28" text-anchor="middle" font-size="18" fill="#3a3a3a">go-scout 機能</text>

  <!-- カード 1: クエリビルダーチェーン -->
  <rect x="40" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">クエリビルダーチェーン（scout.Builder）</text>
  <text x="60" y="100" font-size="11" fill="#555">ストリーミング API: Query · Where · WhereIn · WhereNotIn · OrderBy · Take</text>
  <text x="60" y="120" font-size="11" fill="#555">高度: VectorSearch · WhereRange · WhereGeoDistance · Aggregate</text>
  <text x="60" y="140" font-size="11" fill="#555">コールバック注入: QueryCB · CallbackCB · AddResultProcessor</text>

  <!-- カード 2: DSL 中間表現 -->
  <rect x="480" y="52" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="78" font-size="14" font-weight="bold" fill="#3a3a3a">DSL 中間表現（engines/dsl.go）</text>
  <text x="500" y="100" font-size="11" fill="#555">高度な条件を bool クエリ JSON にコンパイル（must · filter · should）</text>
  <text x="500" y="120" font-size="11" fill="#555">multi_match · term · range · geo_distance · wildcard · regexp …</text>
  <text x="500" y="140" font-size="11" fill="#555">ES / OpenSearch 共用; MapBooleanToBoolKey が and/or/not を変換</text>

  <!-- カード 3: ページネーションとカーソル -->
  <rect x="40" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">ページネーションとカーソル</text>
  <text x="60" y="232" font-size="11" fill="#555">Paginate · SimplePaginate · Cursor 遅延ストリーミング</text>
  <text x="60" y="252" font-size="11" fill="#555">PaginationResult: LastPage · HasMorePages · AppendQuery</text>
  <text x="60" y="272" font-size="11" fill="#555">Result.As[T] / パッケージレベル GetAs[T] 汎用取得</text>

  <!-- カード 4: ソフトデリート -->
  <rect x="480" y="184" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="210" font-size="14" font-weight="bold" fill="#3a3a3a">ソフトデリート</text>
  <text x="500" y="232" font-size="11" fill="#555">__soft_deleted メタデータをドキュメントとともに索引へ（0 / 1）</text>
  <text x="500" y="252" font-size="11" fill="#555">OnlyTrashed / WithTrashed クエリフィルタ</text>
  <text x="500" y="272" font-size="11" fill="#555">オブザーバー Deleted 分岐 · ForceDeleted / Restored</text>

  <!-- カード 5: 非同期キュー -->
  <rect x="40" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">非同期キュー（scout.Queue）</text>
  <text x="60" y="364" font-size="11" fill="#555">プロセス内キュー: chan バッファ 4096 + ワーカー goroutine</text>
  <text x="60" y="384" font-size="11" fill="#555">キュー不可なら同期フォールバックと警告</text>
  <text x="60" y="404" font-size="11" fill="#555">MakeAllSearchable チャンク分割インポート（デフォルト 500）</text>

  <!-- カード 6: イベントとオブザーバー -->
  <rect x="480" y="316" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="342" font-size="14" font-weight="bold" fill="#3a3a3a">イベントとオブザーバー</text>
  <text x="500" y="364" font-size="11" fill="#555">ModelObserver が Saved · Deleted · Restored を検知し自動同期</text>
  <text x="500" y="384" font-size="11" fill="#555">EventBus が models_imported · models_flushed を発行</text>
  <text x="500" y="404" font-size="11" fill="#555">WithoutSyncingToSearch で同期を一時無効化</text>

  <!-- カード 7: マルチエンジン登録 -->
  <rect x="40" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">マルチエンジン登録（EngineManager）</text>
  <text x="60" y="496" font-size="11" fill="#555">Extend + engines.Register で 16 ドライバ名を登録</text>
  <text x="60" y="516" font-size="11" fill="#555">ドライバは遅延生成・キャッシュ; 未知なら ErrNotSupported</text>
  <text x="60" y="536" font-size="11" fill="#555">エンジン切り替えは SCOUT_DRIVER の変更のみ</text>

  <!-- カード 8: 高度な検索 -->
  <rect x="480" y="448" width="440" height="112" rx="8" fill="#f4f3ee" stroke="#4a4a4a" stroke-width="2"/>
  <text x="500" y="474" font-size="14" font-weight="bold" fill="#3a3a3a">高度な検索（AdvancedEngine）</text>
  <text x="500" y="496" font-size="11" fill="#555">AdvancedSearch · GetAggregations · GetFacets</text>
  <text x="500" y="516" font-size="11" fill="#555">ベクトル類似度 · 範囲 · 地理距離フィルタとソート</text>
  <text x="500" y="536" font-size="11" fill="#555">集計（Aggregate）+ ファセット（Facet）+ ハイライト</text>

  <!-- 下部 -->
  <rect x="40" y="582" width="880" height="36" rx="8" fill="#ebe9e3" stroke="#4a4a4a" stroke-width="2"/>
  <text x="480" y="605" text-anchor="middle" font-size="13" fill="#3a3a3a">純粋な標準ライブラリ · サードパーティ依存ゼロ · Go 1.24 · webman/laravel-scout の移植</text>
  <!-- go-scout 项目宠物小侦 / mascot signature -->
  <g transform="translate(22,2) scale(0.24)">
    <g fill="none" stroke="#2f6f6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M 136.8 31.1 A 22 22 0 0 1 150.9 45.2"/>
      <path d="M 140.5 19.7 A 34 34 0 0 1 162.3 41.5" opacity=".7"/>
      <path d="M 144.2 8.3 A 46 46 0 0 1 173.7 37.8" opacity=".45"/>
    </g>
    <line x1="130" y1="82" x2="130" y2="58" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="52" r="8" fill="#2f6f6a" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="127.4" cy="49.4" r="2.4" fill="#ffffff" opacity=".9"/>
    <circle cx="130" cy="130" r="50" fill="#dbe8e5" stroke="#4a4a4a" stroke-width="7"/>
    <path d="M 96.2 117.7 A 36 36 0 0 1 117.7 96.2" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <circle cx="114" cy="132" r="7" fill="#3a3a3a"/>
    <circle cx="146" cy="132" r="7" fill="#3a3a3a"/>
    <path d="M 118 152 Q 130 162 142 152" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
